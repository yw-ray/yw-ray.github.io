<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Why reflection saves capacity when rotations cannot align asymmetric corner ports"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="840" fill="#f8fafc"/><text x="28" y="38" font-size="28" fill="#152238" text-anchor="start" font-weight="bold">Why rotation alone cannot reuse the lean corner tile</text><text x="28" y="67" font-size="17" fill="#152238" text-anchor="start" font-weight="normal">Measured example: Transformer · 2×2 mesh · 4 cores/chiplet · batch 1 · 8 channels/port</text><rect x="24" y="88" width="350" height="300" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="44" y="117" font-size="20" fill="#152238" text-anchor="start" font-weight="bold">1. Required traffic shape</text><rect x="77" y="157" width="50" height="40" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="102" y="183" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C0</text><rect x="267" y="157" width="50" height="40" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="292" y="183" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C1</text><rect x="77" y="292" width="50" height="40" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="102" y="318" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C2</text><rect x="267" y="292" width="50" height="40" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="292" y="318" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C3</text><line x1="102" y1="201" x2="102" y2="287" stroke="#d97706" stroke-width="5"/><text x="114" y="250" font-size="17" fill="#d97706" text-anchor="start" font-weight="normal">128</text><line x1="292" y1="201" x2="292" y2="287" stroke="#d97706" stroke-width="5"/><text x="304" y="250" font-size="17" fill="#d97706" text-anchor="start" font-weight="normal">128</text><line x1="130" y1="177" x2="264" y2="177" stroke="#2563eb" stroke-width="5"/><text x="197" y="165" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="normal">64</text><line x1="130" y1="312" x2="264" y2="312" stroke="#2563eb" stroke-width="5"/><text x="197" y="300" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="normal">64</text><text x="44" y="365" font-size="14" fill="#152238" text-anchor="start" font-weight="normal">Values are B/cycle in EACH direction.</text><rect x="392" y="88" width="784" height="300" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="412" y="117" font-size="20" fill="#152238" text-anchor="start" font-weight="bold">2. Same corner type, opposite port ordering</text><text x="565" y="150" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C0 target</text><rect x="513.0" y="183.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="555" y="232" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">C0</text><rect x="535" y="262.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="555" y="293.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="592.0" y="205" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="610.0" y="231" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">64</text><text x="954" y="150" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">C1 target</text><rect x="913.0" y="183.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="955" y="232" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">C1</text><rect x="935" y="262.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="955" y="293.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="908.0" y="205" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="900.0" y="231" font-size="17" fill="#2563eb" text-anchor="end" font-weight="bold">64</text><line x1="685" y1="220" x2="813" y2="220" stroke="#7c3aed" stroke-width="3"/><text x="750" y="201" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="normal">Reflect E ↔ W</text><text x="750" y="251" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="normal">Keep S = 128</text><text x="412" y="344" font-size="18" fill="#152238" text-anchor="start" font-weight="bold">Rotation preserves cyclic port order. Reflection reverses it.</text><text x="412" y="370" font-size="16" fill="#152238" text-anchor="start" font-weight="normal">H = 128 and L = 64 cannot simply exchange places by rotation.</text><text x="28" y="429" font-size="23" fill="#152238" text-anchor="start" font-weight="bold">3. Try all four rotations of the C0 tile at C1</text><rect x="24" y="447" width="278" height="230" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="163" y="475" font-size="18" fill="#152238" text-anchor="middle" font-weight="bold">0°</text><rect x="121.0" y="509.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="163" y="558" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">A</text><rect x="143" y="588.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="163" y="619.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="200.0" y="531" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="218.0" y="557" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">64</text><text x="163" y="650" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="normal">Wrong connected sides</text><rect x="316" y="447" width="278" height="230" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="455" y="475" font-size="18" fill="#152238" text-anchor="middle" font-weight="bold">90°</text><rect x="413.0" y="509.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="455" y="558" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">A</text><rect x="408.0" y="531" width="10" height="40" rx="2" fill="#d97706" stroke="#d97706"/><text x="400.0" y="557" font-size="17" fill="#d97706" text-anchor="end" font-weight="bold">128</text><rect x="435" y="588.0" width="40" height="10" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="455" y="619.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">64</text><text x="455" y="650" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="normal">Correct sides; sizes swapped</text><rect x="608" y="447" width="278" height="230" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="747" y="475" font-size="18" fill="#152238" text-anchor="middle" font-weight="bold">180°</text><rect x="705.0" y="509.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="747" y="558" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">A</text><rect x="727" y="504.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="747" y="495.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="700.0" y="531" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="692.0" y="557" font-size="17" fill="#2563eb" text-anchor="end" font-weight="bold">64</text><text x="747" y="650" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="normal">Wrong connected sides</text><rect x="900" y="447" width="278" height="230" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1039" y="475" font-size="18" fill="#152238" text-anchor="middle" font-weight="bold">270°</text><rect x="997.0" y="509.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="1039" y="558" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">A</text><rect x="1076.0" y="531" width="10" height="40" rx="2" fill="#d97706" stroke="#d97706"/><text x="1094.0" y="557" font-size="17" fill="#d97706" text-anchor="start" font-weight="bold">128</text><rect x="1019" y="504.0" width="40" height="10" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="1039" y="495.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">64</text><text x="1039" y="650" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="normal">Wrong connected sides</text><rect x="24" y="695" width="1152" height="126" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="44" y="726" font-size="20" fill="#152238" text-anchor="start" font-weight="bold">Rotation only: both port sizes must be 128 → 2,048 B/cycle manufactured.</text><text x="44" y="756" font-size="20" fill="#047857" text-anchor="start" font-weight="bold">Reflection allowed: keep port sizes 128 + 64 → 1,536 B/cycle, 25% less.</text><text x="44" y="788" font-size="15" fill="#152238" text-anchor="start" font-weight="normal">Capacity = 4 dies × 2 (TX + RX) × sum of two port sizes. All channel sums and execution times are verified.</text></svg>