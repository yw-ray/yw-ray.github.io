<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 891" role="img" aria-label="Conceptual double-sided interposer attachment realizing opposite projected die handedness"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="891" fill="#f8fafc"/><text x="28" y="38" font-size="27" fill="#152238" text-anchor="start" font-weight="bold">Physical concept: use the same die on opposite sides of an interposer</text><text x="28" y="67" font-size="17" fill="#152238" text-anchor="start" font-weight="normal">A common top view sees opposite handedness when one copy is turned over about an in-plane axis.</text><rect x="24" y="88" width="1152" height="285" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="44" y="119" font-size="20" fill="#152238" text-anchor="start" font-weight="bold">A. Project both placements into the SAME top-view coordinate system</text><rect x="232.0" y="178.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="274" y="227" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">Top</text><rect x="254" y="257.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="274" y="288.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="311.0" y="200" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="329.0" y="226" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">64</text><rect x="870.0" y="178.0" width="84" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="912" y="227" font-size="23" fill="#152238" text-anchor="middle" font-weight="bold">Bottom</text><rect x="892" y="257.0" width="40" height="10" rx="2" fill="#d97706" stroke="#d97706"/><text x="912" y="288.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">128</text><rect x="865.0" y="200" width="10" height="40" rx="2" fill="#2563eb" stroke="#2563eb"/><text x="857.0" y="226" font-size="17" fill="#2563eb" text-anchor="end" font-weight="bold">64</text><text x="274" y="328" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">Top-side placement</text><text x="912" y="328" font-size="17" fill="#152238" text-anchor="middle" font-weight="normal">Bottom-side placement, projected from above</text><line x1="411" y1="221" x2="771" y2="221" stroke="#7c3aed" stroke-width="3"/><text x="593" y="191" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="normal">180° out-of-plane turn about N–S axis</text><text x="593" y="252" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="normal">E ↔ W; N / S stay in place</text><text x="593" y="280" font-size="16" fill="#152238" text-anchor="middle" font-weight="normal">An in-plane rotation cannot do this.</text><rect x="24" y="393" width="1152" height="383" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="44" y="423" font-size="20" fill="#152238" text-anchor="start" font-weight="bold">B. Cross-section: BOTH bump faces point toward the interposer</text><rect x="155" y="475" width="260" height="70" rx="5" fill="#dbeafe" stroke="#60a5fa"/><rect x="155" y="533" width="260" height="12" rx="0" fill="#2563eb" stroke="#2563eb"/><text x="285" y="509" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">Same die design</text><rect x="175" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="220" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="265" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="310" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="355" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="400" y="546" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="102" y="566" width="995" height="86" rx="3" fill="#e2e8f0" stroke="#94a3b8"/><text x="570" y="598" font-size="20" fill="#152238" text-anchor="middle" font-weight="bold">Silicon interposer</text><line x1="182" y1="578" x2="872" y2="578" stroke="#b7791f" stroke-width="5"/><line x1="872" y1="578" x2="872" y2="639" stroke="#b7791f" stroke-width="7"/><line x1="770" y1="639" x2="990" y2="639" stroke="#b7791f" stroke-width="5"/><text x="482" y="631" font-size="17" fill="#152238" text-anchor="start" font-weight="normal">RDL routing + TSV / through-interposer path</text><rect x="750" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="795" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="840" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="885" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="930" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="975" y="653" width="9" height="19" rx="2" fill="#d6a340" stroke="#a16207"/><rect x="730" y="674" width="260" height="70" rx="5" fill="#ede9fe" stroke="#a78bfa"/><rect x="730" y="674" width="260" height="12" rx="0" fill="#7c3aed" stroke="#7c3aed"/><text x="860" y="719" font-size="18" fill="#152238" text-anchor="middle" font-weight="normal">Same die, turned over</text><text x="452" y="491" font-size="18" fill="#2563eb" text-anchor="start" font-weight="bold">Active face DOWN</text><line x1="450" y1="498" x2="413" y2="539" stroke="#2563eb" stroke-width="2"/><text x="452" y="519" font-size="16" fill="#152238" text-anchor="start" font-weight="normal">Bumps connect to upper surface</text><text x="309" y="704" font-size="18" fill="#7c3aed" text-anchor="start" font-weight="bold">Active face UP</text><line x1="475" y1="700" x2="728" y2="682" stroke="#7c3aed" stroke-width="2"/><text x="309" y="730" font-size="16" fill="#152238" text-anchor="start" font-weight="normal">Bumps connect to lower surface</text><text x="44" y="808" font-size="18" fill="#152238" text-anchor="start" font-weight="bold">Geometry proposal, not a validated package for this mesh. Opposite-side placement changes the package.</text><text x="44" y="837" font-size="16" fill="#152238" text-anchor="start" font-weight="normal">Additional routing, TSVs, power delivery, cooling, assembly and PHY timing must be accounted for physically.</text><text x="44" y="865" font-size="16" fill="#152238" text-anchor="start" font-weight="normal">These overheads and delays are not included in the bandwidth-reduction numbers. Illustration is not to scale.</text></svg>