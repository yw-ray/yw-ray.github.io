<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workloads · research dashboard</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f7fa;color:#152238}nav{display:flex;gap:8px;margin-bottom:14px}button{padding:7px 12px;font:inherit;border:1px solid #ccd5e0;border-radius:7px;background:#fff;cursor:pointer}button[aria-selected="true"]{background:#152238;color:#fff;border-color:#152238}iframe{width:100%;border:0;display:block;min-height:900px}.note{color:#536477;font-size:13px;margin:0 0 10px}</style>
<nav role="tablist" aria-label="Workload pages"><button id="chunk4-tab" role="tab" aria-selected="true" data-src="chunk4.html?v=20261022140735">4 chunks · shared HW</button><button id="c16dram-tab" role="tab" aria-selected="false" data-src="c16-dram-placement.html">C16 · DRAM placement</button><button id="kremap-tab" role="tab" aria-selected="false" data-src="template-count.html">Template count K</button><button id="demand-tab" role="tab" aria-selected="false" data-src="traffic-demand.html?v=20261023133353">Traffic demand</button><button id="edp-tab" role="tab" aria-selected="false" data-src="energy-edp.html?v=20261022032343">Energy · EDP</button><button id="backup-tab" role="tab" aria-selected="false" data-src="workloads-backup.html">Backup · previous workloads page</button></nav>
<p id="backup-note" class="note" hidden>The previous contents of this page (current/archived workload designs, traffic patterns, bandwidth reduction, execution time), unchanged.</p><iframe id="frame" title="Workload page"></iframe>
<script>
const OLD=['designs','patterns','bandwidth','execution'];
const frame=document.getElementById('frame'),tabs=[...document.querySelectorAll('nav button')];
function show(id,anchor){
 const btn=document.getElementById(id+'-tab')||tabs[0];
 for(const b of tabs)b.setAttribute('aria-selected',String(b===btn));
 document.getElementById('backup-note').hidden=btn.id!=='backup-tab';
 const want=btn.dataset.src+(anchor?'#'+anchor:'');
 if(frame.getAttribute('src')!==want){frame.style.height='';frame.src=want}
 history.replaceState(null,'','#'+(anchor||btn.id.replace(/-tab$/,'')));
}
function route(){const h=location.hash.slice(1);if(OLD.includes(h))show('backup',h);else show(h)}
for(const b of tabs)b.onclick=()=>show(b.id.replace(/-tab$/,''));
window.addEventListener('hashchange',route);route();
// Same-origin frame: follow its content height.
setInterval(()=>{try{const h=frame.contentDocument&&frame.contentDocument.documentElement.scrollHeight;if(h&&Math.abs(frame.offsetHeight-h)>4)frame.style.height=h+'px'}catch(e){}},800);
</script></html>
